name: Test

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  test:
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        go-version: [1.20.x]
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
      -
        name: Install APT Packages (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install luarocks gnupg
          echo "/usr/local/bin" >> $GITHUB_PATH
      -
        name: Install Homebrew Packages (macOS only)
        if: matrix.os == 'macos-latest'
        run: |
          brew install luarocks gnupg
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
      -
        name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      -
        name: Checkout code
        uses: actions/checkout@v7
      -
        name: Test
        run: make test
      -
        name: Upload coverage files to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          disable_search: true
          files: ./coverage.txt
          flags: unittests
